services:
  valkey:
    build:
      context: .
      dockerfile: Dockerfile.valkey
    ports:
      - "6390:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        sleep 5 &&
        ollama pull mxbai-embed-large &&
        ollama pull mistral:7b
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434

volumes:
  valkey-data:
  ollama-data:
